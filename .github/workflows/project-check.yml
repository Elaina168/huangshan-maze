name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check documentation, evidence and commit history
        run: python scripts/check_project.py --history
      - name: Check build snapshot invalidation
        run: python scripts/test_build_snapshot.py
